<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Decor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Google Fonts: Inter, Mulish, Quicksand -->

    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Mulish:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>

<body>
  <load src="./partials/header.html" icon-menu="./img/sprite.svg#icon-menu" />

  <main>
    <load src="./partials/hero.html" />

      icon-surprises="./img/sprite.svg#surprises" />
    <load src="./partials/reviews.html" icon-star="./img/sprite.svg#starr" icon-empty-star="./img/sprite.svg#starr-none"
