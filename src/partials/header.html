<header class="header">
  <div class="container header-container">
    <a
      class="header-logo"
      href="./index.html"
      aria-label="Travel Decor: Journey Match"
    >
      <img
        src="./img/sections/header/logo.png"
        srcset="
          ./img/sections/header/logo.png    1x,
          ./img/sections/header/logo-2x.png 2x
        "
        alt="Travel Decor: Journey Match logo"
        width="58"
        height="37"
        loading="lazy"
      />
    </a>

    <nav class="header-nav" aria-label="Main navigation">
      <ul class="header-nav-list">
        <li class="header-nav-item">
          <a class="header-nav-link" href="#about">About</a>
        </li>

        <li class="header-nav-item">
          <a class="header-nav-link" href="#how-to-play">How to Play</a>
        </li>

        <li class="header-nav-item">
          <a class="header-nav-link" href="#features">Features</a>
        </li>

        <li class="header-nav-item">
          <a class="header-nav-link" href="#reviews">Reviews</a>
        </li>

        <li class="header-nav-item">
          <a class="header-nav-link" href="#contact">Contact</a>
        </li>
      </ul>
    </nav>

    <a
      class="header-btn"
      href="https://play.google.com/store/apps/details?id=com.dream.fun.journeymatch&hl=en&gl=us"
      target="_blank"
      rel="noopener noreferrer"
    >
      GOOGLE PLAY
    </a>

    <button
      class="header-burger"
      type="button"
      aria-label="Open menu"
      aria-expanded="false"
      aria-controls="mobile-menu"
      data-action="open"
    >
      <svg class="header-burger-icon" width="24" height="24">
        <use href="{=$icon-menu}"></use>
      </svg>
    </button>
  </div>
</header>
